name: Prova la griglia sul simulatore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  spazio:
    name: Quanti pezzi di prove
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      quanti: ${{ steps.conta.outputs.quanti }}
      pezzi: ${{ steps.conta.outputs.pezzi }}
    steps:
      - uses: actions/checkout@v4
      - id: conta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 strumenti/quanti_pezzi.py "$(python3 strumenti/le_mie_prove.py quante VisoreProve VisoreProve)"

  simulatore:
    name: Prove sul simulatore, pezzo ${{ matrix.pezzo }} di ${{ needs.spazio.outputs.quanti }}
    needs: spazio
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        pezzo: ${{ fromJSON(needs.spazio.outputs.pezzi) }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          ultimo=$(ls -d /Applications/Xcode_26*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$ultimo"
          xcodebuild -version
      - name: Pacchetto di prova
        run: |
          python3 -m venv /tmp/py
          /tmp/py/bin/pip install --quiet pillow
          /tmp/py/bin/python strumenti/prepara.py
      - name: Progetto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Prove sul simulatore
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; v=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]; print(v[0]['udid'])")
          echo "Simulatore $id"
          scelte=$(python3 strumenti/le_mie_prove.py solo VisoreProve VisoreProve "${{ matrix.pezzo }}/${{ needs.spazio.outputs.quanti }}")
          echo "$scelte"
          xcodebuild test -project Visore.xcodeproj -scheme Visore -configuration Release -destination "id=$id" \
            $scelte -resultBundlePath prove.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee prove.log | grep -E "error|failed|passed|Test Case|XCTAssert|crash|Fatal" || true
          grep -q "TEST SUCCEEDED" prove.log
      - name: Schermate
        if: always()
        run: |
          mkdir -p schermate
          xcrun xcresulttool export attachments --path prove.xcresult --output-path schermate || true
          cd schermate && for f in $(find . -name "*.txt" -size +1k); do echo "=== $f"; cat "$f"; done
      - name: Schermate piccole nel registro
        if: always()
        run: |
          cd schermate
          python3 -c "
          import json
          for t in json.load(open('manifest.json')):
              for a in t.get('attachments', []):
                  n = a.get('suggestedHumanReadableName', '')
                  if n.endswith('.png') and not n.startswith('Screen'):
                      print(a['exportedFileName'], n.split('_')[0])
          " | sort -k2 | while read f nome; do
            sips -Z 520 -s format jpeg -s formatOptions 55 "$f" --out "/tmp/$nome.jpg" >/dev/null
            echo "SCHERMATA $nome $(base64 -i /tmp/$nome.jpg | tr -d '\n')"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-${{ matrix.pezzo }}
          path: schermate
