name: Costruisci il Visore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prove di VisoreKit
        run: swift test --package-path VisoreKit
      - name: Progetto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Costruzione senza firma
        run: |
          xcodebuild -project Visore.xcodeproj -scheme Visore -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath costruito CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R costruito/Build/Products/Release-iphoneos/Visore.app Payload/
          zip -qry Visore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Visore
          path: Visore.ipa
      - name: Rilascio
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Visore.ipa --title "Visore" --notes "Da installare con SideStore o AltStore dal PC Windows."
