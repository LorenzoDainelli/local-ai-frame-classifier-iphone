name: Costruisci il Visore

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pubblica:
        description: "si = la versione arriva in AltStore (fine tappa)"
        default: "no"

permissions:
  contents: write

jobs:
  spazio:
    name: Quanti pezzi di prove
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      quanti: ${{ steps.conta.outputs.quanti }}
      pezzi: ${{ steps.conta.outputs.pezzi }}
    steps:
      - uses: actions/checkout@v4
      - id: conta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 strumenti/quanti_pezzi.py "$(python3 strumenti/le_mie_prove.py quante VisoreKit/Tests VisoreKitTests)"

  kit:
    name: Prove di VisoreKit, pezzo ${{ matrix.pezzo }} di ${{ needs.spazio.outputs.quanti }}
    needs: spazio
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        pezzo: ${{ fromJSON(needs.spazio.outputs.pezzi) }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          ultimo=$(ls -d /Applications/Xcode_26*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$ultimo"
          xcodebuild -version
      - name: Pacchetto di prova
        run: |
          python3 -m venv /tmp/py
          /tmp/py/bin/pip install --quiet pillow
          /tmp/py/bin/python strumenti/prepara.py
      - name: Le prove di questo pezzo
        run: |
          filtro=$(python3 strumenti/le_mie_prove.py filtro VisoreKit/Tests VisoreKitTests "${{ matrix.pezzo }}/${{ needs.spazio.outputs.quanti }}")
          echo "$filtro"
          if [ -n "$filtro" ]; then
            swift test -c release -Xswiftc -enable-testing --package-path VisoreKit --filter "$filtro"
          fi

  ipa:
    needs: kit
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          ultimo=$(ls -d /Applications/Xcode_26*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$ultimo"
          xcodebuild -version
      - name: Pacchetto di prova e icona
        run: |
          python3 -m venv /tmp/py
          /tmp/py/bin/pip install --quiet pillow
          /tmp/py/bin/python strumenti/prepara.py
      - name: Progetto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Costruzione senza firma
        run: |
          xcodebuild -project Visore.xcodeproj -scheme Visore -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath costruito CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=3.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir -p Payload
          cp -R costruito/Build/Products/Release-iphoneos/Visore.app Payload/
          zip -qry Visore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Visore
          path: Visore.ipa
      - name: Sorgente per AltStore
        run: |
          VERSIONE=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Visore.app/Info.plist)
          NUMERO=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Payload/Visore.app/Info.plist)
          MINIMO=$(/usr/libexec/PlistBuddy -c "Print MinimumOSVersion" Payload/Visore.app/Info.plist)
          /tmp/py/bin/python strumenti/fai_sorgente.py "$VERSIONE" "$NUMERO" "$MINIMO" Visore.ipa \
            "https://github.com/${{ github.repository }}" > sorgente.json
          cat sorgente.json
      - name: Rilascio
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.pubblica == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Visore.ipa sorgente.json Visore/Assets.xcassets/AppIcon.appiconset/icona.png \
            --title "Visore" --notes "Si installa e si aggiorna con AltStore. In AltStore: Sorgenti, +, e l'indirizzo di sorgente.json qui sotto."
