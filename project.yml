name: Visore
options:
  bundleIdPrefix: local.visore
  deploymentTarget:
    iOS: "18.0"
packages:
  VisoreKit:
    path: VisoreKit
targets:
  Visore:
    type: application
    platform: iOS
    sources:
      - path: Visore
      - path: Prova
        type: folder
        buildPhase: resources
    dependencies:
      - package: VisoreKit
    info:
      path: Visore/Info.plist
      properties:
        CFBundleDisplayName: Visore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Face ID apre l'archivio senza riscrivere la password.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.visore.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "2"
