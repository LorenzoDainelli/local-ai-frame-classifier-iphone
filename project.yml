name: Visore
options:
  bundleIdPrefix: local.visore
  deploymentTarget:
    iOS: "17.0"
packages:
  VisoreKit:
    path: VisoreKit
targets:
  Visore:
    type: application
    platform: iOS
    sources: [Visore]
    dependencies:
      - package: VisoreKit
    info:
      path: Visore/Info.plist
      properties:
        CFBundleDisplayName: Visore
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Face ID apre l'archivio senza riscrivere la password.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.visore.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
